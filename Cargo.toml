[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/protocol",
  "crates/daemon",
  "crates/cli",
  "crates/supervisor-core",
  "crates/supervisor-daemon",
  "crates/supervisor-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
agent-bus-core = { path = "crates/core" }
agent-bus-protocol = { path = "crates/protocol" }
supervisor-core = { path = "crates/supervisor-core" }
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = "0.4.44"
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.28"
fs2 = "0.4.3"
humantime = "2.4.0"
ratatui = { version = "0.29", features = ["crossterm"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream", "blocking"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal", "process"] }
toml = "0.8.19"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ulid = { version = "3.0.0", features = ["serde"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
strip = true
opt-level = "z"
