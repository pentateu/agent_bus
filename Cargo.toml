[workspace]
resolver = "3"
members = ["crates/core", "crates/protocol", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
agent-bus-core = { path = "crates/core" }
agent-bus-protocol = { path = "crates/protocol" }
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
fs2 = "0.4.3"
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
ulid = { version = "3.0.0", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
strip = true
opt-level = "z"
