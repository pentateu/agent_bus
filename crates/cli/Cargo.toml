[package]
name = "agent-bus-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "agent-bus"
path = "src/main.rs"

[dependencies]
agent-bus-core = { workspace = true }
agent-bus-protocol = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = "0.28"
humantime = { workspace = true }
ratatui = { version = "0.29", features = ["crossterm"] }
serde_json = { workspace = true }

# `serde_json` is already a normal dependency and is therefore in scope for
# unit tests too, so it is deliberately not repeated here.
[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
